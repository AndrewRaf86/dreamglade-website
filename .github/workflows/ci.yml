name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check application
        run: npm run typecheck:app
      - name: Type-check scripts
        run: npm run typecheck
      - name: Audit canonical facts
        run: npm run audit:facts
      - name: Audit AI-readiness contracts
        run: npm run audit:agent
      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high
      - name: Build production application
        run: npm run build
      - name: Smoke-test production server
        shell: bash
        run: |
          npm run start -- --port 3000 > /tmp/dreamglade-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/dreamglade-next.log
            exit 1
          fi

          SMOKE_TEST_BASE_URL=http://localhost:3000 npm run smoke-test
